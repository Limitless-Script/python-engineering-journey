[project]
name = "python-engineering-journey"
version = "0.1.0"
description = "A structured Python learning path from foundations to advanced software engineering."
readme = "README.md"
authors = [
    { name = "Do Anh Duy", email = "doanhduyxavie@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]
markers = [
    "exercise: test depends on an intentionally-unfinished exercise stub; deselected in CI with -m 'not exercise'.",
]

[tool.ruff]
line-length = 100
target-version = "py313"
# Exercise stubs are intentionally incomplete (unused imports, missing bodies);
# they are the learner's homework, so keep them out of automated linting.
extend-exclude = ["**/exercises/**"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
show_error_codes = true
# Exercise stubs return placeholder values and won't type-check until completed.
exclude = ['/exercises/']

[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "**/exercises/**",
    "**/examples/**",
]

[tool.coverage.report]
show_missing = true
